[package]
name = "mangle-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.14.0", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3.6.10"
regex = "1"
cssparser = "0.38.0"
html5gum = "0.8.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

oxc_allocator = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_ast_visit = "=0.146.0"
oxc_span = "=0.146.0"
oxc_semantic = "=0.146.0"
oxc_codegen = "=0.146.0"

[build-dependencies]
napi-build = "2.6.0"
